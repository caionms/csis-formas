[app]
loglevel = "INFO"

[dropbox.models.yolo]
plate_detection = "/plates.pt"
yolo11x = "/yolo11x.pt"
pose = "/yolo11x-pose.pt"

[dropbox.models.yolo.public_safety]
public_safety = "/public_safety.pt"
fire_smoke_detection = "/fire.pt"
flood_detection = "/flood.pt"
weapon_detection = "/weapon.pt"
graffiti_spray_detection = "/graffiti.pt"

[dropbox.models.paddleocr]
plate_recognition = "/best_inference_paddle"
plate_detection = "/en_PP-OCRv3_det_infer"
plate_cls = "/ch_ppocr_mobile_v2.0_cls_infer"

[paddleocr]
rec_algorithm = "SVTR_LCNet"
rec_image_shape = "3,48,320"
use_space_char = true
use_gpu = false
