tracker_type: botsort  # Ou 'bytetrack', mas 'botsort' é melhor para casos como o seu
track_high_thresh: 0.87  # Aumenta a confiabilidade na primeira associação (padrão: 0.25)
track_low_thresh: 0.87   # Evita rastrear detecções de baixa confiança (padrão: 0.1)
new_track_thresh: 0.89   # Evita criar IDs novos para placas que aparecem rapidamente (padrão: 0.25)
track_buffer: 50        # Mantém IDs ativos por mais tempo antes de remover (padrão: 30)
match_thresh: 0.9       # Exige uma correspondência mais precisa entre detecções consecutivas (padrão: 0.8)
fuse_score: True        # Mantém a fusão entre confiança e IoU para melhorar a estabilidade
gmc_method: sparseOptFlow  # Mantém a compensação de movimento para evitar oscilações no tracking

# ReID (Re-Identification) pode ser útil se houver múltiplas placas parecidas
proximity_thresh: 0.6   # Aumenta a proximidade exigida para associação (padrão: 0.5)
appearance_thresh: 0.3  # Exige maior semelhança visual antes de criar um novo ID (padrão: 0.25)
with_reid: False        # Pode ser True se usar um modelo de ReID para evitar troca de IDs entre placas
