name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: CI - Testes e Análises
    runs-on: ubuntu-latest

    steps:
      # Etapa 1: Checkout do Código
      - name: Checkout Code
        uses: actions/checkout@v3

      # Etapa 2: Configuração do Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # Etapa 3: Instalação do Poetry
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      # Etapa 4: Instalação das Dependências
      - name: Install Dependencies
        run: poetry install --no-root

      # Etapa 5: Instalação do Torch
      - name: Install Torch
        run: poetry add torch

      # Etapa 6: Instalação do PaddlePaddle
      - name: Install PaddlePaddle
        run: poetry add paddlepaddle

      # Etapa 7: Configuração do PYTHONPATH
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      # Etapa 8: Verificação de Formatação com Black
      - name: Format Check
        run: poetry run black --check .

      # Etapa 9: Linting com Ruff
      - name: Python Code Lint
        run: poetry run ruff check .

      # Etapa 10: Verificação de Tipagem Estática com MyPy
      - name: Static Type Check
        run: |
          mkdir -p .mypy_cache
          poetry run mypy \
            application config domain infrastructure presentation tests \
            --ignore-missing-imports \
            --install-types \
            --non-interactive \
            --explicit-package-bases

      # Etapa 11: Verificação de Dependências com Deptry
      - name: Dependency Check
        run: poetry run deptry . --per-rule-ignores 'DEP002=paddlepaddle|pytest-cov'

      - name: Run Unit Tests
        env:
          DYNACONF_DROPBOX__ACCESS_TOKEN: "fake_access_token"
          DYNACONF_DROPBOX__APP_KEY: "fake_app_key"
          DYNACONF_DROPBOX__APP_SECRET: "fake_app_secret"
          DYNACONF_DROPBOX__REFRESH_TOKEN: "fake_refresh_token"
          DYNACONF_DROPBOX__OFFLINE_ACCESS_CODE: "fake_offline_code"
          ENV_FOR_DYNACONF: "test"
        run: |
          poetry run pytest --cov=application --cov=config --cov=domain --cov=infrastructure --cov=presentation --cov=tests --cov-report=term --cov-report=xml:coverage.xml tests

      # Artefatos: Relatórios de Cobertura e Testes
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml